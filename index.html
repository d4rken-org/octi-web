<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/octi-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/octi-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <!--
      Strict CSP: no remote scripts, no inline scripts, no third-party assets.
      The 'unsafe-inline' on style-src is needed for Svelte's scoped <style> blocks;
      script-src has no 'unsafe-inline' / 'unsafe-eval' so injected scripts can't run.
      connect-src is intentionally open — the sync-server address is user-supplied
      at runtime and we can't enumerate it here. The IndexedDB-stored credentials
      are the high-value target, so the script/object/frame restrictions matter most.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src *; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    />
    <title>Octi Web</title>
    <!-- Tab background while the SPA boots, matches theme-color. Prevents the
         flash-of-white on dark-mode browsers between document parse and Svelte
         mount. -->
    <style>
      html, body { background: #0a0a0a; margin: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
